# Build and test on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nobody runs a debugger on these builds: without debug information they compile and link
  # faster and the cache of built libraries is several times smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    working-directory: app

jobs:
  linux:
    name: Linux — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: linux
          cache-on-failure: true
      # Only the test build: the program on its own is built by the MinGW and Screenshots
      # jobs, and building both here compiles the whole crate twice.
      - name: Build
        run: cargo test --locked --no-run
      # The tests make real repositories: they need an author, and line endings left alone.
      - name: Git settings for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main
      - name: Test
        run: cargo test --locked

  windows:
    name: Windows — build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: windows
          cache-on-failure: true
      # Only the test build: the program on its own is built by the MinGW and Screenshots
      # jobs, and building both here compiles the whole crate twice.
      - name: Build
        run: cargo test --locked --no-run
      # The tests make real repositories: they need an author, and line endings left alone.
      - name: Git settings for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main
      - name: Test
        run: cargo test --locked

  # The same way the released Windows program is built: cross-compiled with MinGW.
  windows-cross:
    name: Windows — release toolchain (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: mingw
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --target x86_64-pc-windows-gnu

  # The agreed rules: what clippy calls an error or suspicious fails the job; advice on
  # performance is shown; style and complexity are not checked. The job does not block a
  # merge until its first report has been gone through.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: clippy
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious -W clippy::perf -A clippy::style -A clippy::complexity

  # Pictures of the main screens in both themes, kept with the run for two weeks.
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    needs: linux
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1 libegl1 libxkbcommon-x11-0 fonts-dejavu-core
          rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: linux
          cache-on-failure: true
          save-if: false
      - name: Build
        run: cargo build --locked
      - name: Take the pictures
        run: |
          git config --global user.name "CI" && git config --global user.email "ci@example.com"
          mkdir -p shots
          for view in selected commit diff settings keysetup findaction twintabs halving; do
            for theme in dark light; do
              REFBRAID_THEME=$theme REFBRAID_VIEW=$view xvfb-run -a ./target/debug/refbraid --screenshot "shots/$view-$theme.png" || echo "no picture for $view ($theme)"
            done
          done
          ls -l shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/shots
          retention-days: 14
