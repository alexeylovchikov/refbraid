# A version tag (vX.Y.Z, made by `make release-all` and pushed) builds the installers with
# the same scripts as `make dist` and publishes them as a GitHub release, with the section
# of that version from the changelog as its description. Started by hand (Actions → Release →
# Run workflow) it only builds: the installers stay with the run and nothing is published.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The scripts build right here instead of starting a container of their own.
  GE_IN_CONTAINER: "1"

defaults:
  run:
    working-directory: app

jobs:
  rpm:
    name: RPM for RHEL ${{ matrix.rhel }}
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi${{ matrix.rhel }}/ubi
    strategy:
      matrix:
        rhel: [9, 10]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          dnf install -y -q gcc rpm-build findutils
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the package
        run: sh packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-el${{ matrix.rhel }}
          path: app/dist/*.rpm
          if-no-files-found: error

  # Compiled on Ubuntu 22.04 so the package also installs on Debian 12.
  deb:
    name: Debian and Ubuntu package
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc libc6-dev curl ca-certificates
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the package
        run: sh packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: app/dist/*.deb
          if-no-files-found: error

  # Compiled on RHEL 8 so the one file also starts on older systems.
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi8/ubi
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          dnf install -y -q gcc findutils file
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the AppImage
        run: sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: app/dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows MSI and zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 msitools wixl zip
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Build the installer and the zip
        run: sh packaging/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/dist/*.msi
            app/dist/*.zip
          if-no-files-found: error

  # One program for Apple silicon and Intel. Signed "ad hoc" only: no Apple certificate.
  macos:
    name: macOS application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          uname -m && sw_vers
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the application and the .dmg
        run: sh packaging/build-macos.sh
      # The only place the result is looked at: both architectures are inside, the signature
      # holds, the .dmg opens and the program in it starts and draws its window.
      - name: Check what was built
        run: |
          dmg=$(ls dist/*.dmg)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint /tmp/refbraid-dmg "$dmg"
          app=/tmp/refbraid-dmg/RefBraid.app
          ls -la /tmp/refbraid-dmg "$app/Contents" "$app/Contents/Resources"
          lipo -archs "$app/Contents/MacOS/refbraid" | tee archs.txt
          grep -q arm64 archs.txt && grep -q x86_64 archs.txt
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          sips -g pixelWidth "$app/Contents/Resources/RefBraid.icns"
          "$app/Contents/MacOS/refbraid" --help
          git config --global user.name "CI" && git config --global user.email "ci@example.com"
          mkdir -p shots
          start=$(date +%s)
          "$app/Contents/MacOS/refbraid" --screenshot shots/macos.png
          echo "The picture took $(( $(date +%s) - start )) s (20 or more: drawn without a window)."
          test -s shots/macos.png
          hdiutil detach -quiet /tmp/refbraid-dmg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: app/shots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [rpm, deb, appimage, windows, macos]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The picture from the macOS check is not a file of the release.
      - name: Keep only the installers
        run: rm -f dist/*.png && ls -l dist
      - name: Checksums and notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          built=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n 1)
          if [ "$version" != "$built" ]; then
            echo "::error::The tag says $version, app/Cargo.toml says $built."
            exit 1
          fi
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          sh app/packaging/release-notes.sh "$version" dist > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "RefBraid ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
