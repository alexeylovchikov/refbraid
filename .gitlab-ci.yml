# RefBraid: build and test on every push, installers on a version tag (vX.Y.Z).
# The program is in app/; the installers are built by the same scripts as `make dist`
# (app/packaging/build-*.sh), told with GE_IN_CONTAINER=1 that the job's image already is
# the build environment.

stages:
  - test
  - dist
  - publish

default:
  interruptible: true

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always
  GE_IN_CONTAINER: "1"

# The crates are downloaded once per runner, not on every job.
.cargo-cache: &cargo-cache
  cache:
    key: cargo-$CI_JOB_NAME
    paths:
      - .cargo-home/registry
      - app/target

.rust: &rust
  image: docker.io/library/rust:1-bookworm
  <<: *cargo-cache
  before_script:
    - git config --global user.name "CI" && git config --global user.email "ci@example.com"
    - cd app

.only-tags: &only-tags
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ---------------------------------------------------------------- every push

test:linux:
  <<: *rust
  stage: test
  script:
    - cargo build
    - cargo test

# The Windows program and its tests are compiled (with MinGW); running them needs a Windows
# runner — see test:windows below.
build:windows:
  <<: *rust
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 > /dev/null
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --target x86_64-pc-windows-gnu
    - cargo test --no-run --target x86_64-pc-windows-gnu

# Runs the tests on Windows itself. Started by hand, and only useful once a runner with the
# tag "windows" (Rust and Git for Windows installed) is registered.
test:windows:
  stage: test
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - cd app
    - cargo test

# The agreed rules: what clippy calls an error or suspicious stops the job; style, complexity
# and performance advice is shown but does not. Allowed to fail until the first report has
# been gone through.
lint:clippy:
  <<: *rust
  stage: test
  allow_failure: true
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious -W clippy::perf -A clippy::style -A clippy::complexity

# Pictures of the main screens in both themes, kept with the pipeline for a week.
screenshots:
  <<: *rust
  stage: test
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth libgl1 libegl1 libxkbcommon-x11-0 fonts-dejavu-core > /dev/null
    - cargo build
    - mkdir -p shots
    - |
      for view in selected commit diff settings keysetup findaction twintabs halving; do
        for theme in dark light; do
          REFBRAID_THEME=$theme REFBRAID_VIEW=$view xvfb-run -a ./target/debug/refbraid --screenshot "shots/$view-$theme.png" || echo "no picture for $view ($theme)"
        done
      done
    - ls -l shots
  artifacts:
    paths: [app/shots]
    expire_in: 1 week
    when: always

# ---------------------------------------------------------------- a version tag: installers

.rhel: &rhel
  <<: [*cargo-cache, *only-tags]
  stage: dist
  before_script:
    - dnf install -y -q gcc rpm-build findutils git
    - curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
    - cd app
  artifacts:
    paths: [app/dist]

dist:rpm-el9:
  <<: *rhel
  image: registry.access.redhat.com/ubi9/ubi
  script:
    - sh packaging/build-rpm.sh --el9

dist:rpm-el10:
  <<: *rhel
  image: registry.access.redhat.com/ubi10/ubi
  script:
    - sh packaging/build-rpm.sh

# Compiled on RHEL 8 so the one file also starts on older systems.
dist:appimage:
  <<: *rhel
  image: registry.access.redhat.com/ubi8/ubi
  script:
    - dnf install -y -q file
    - sh packaging/build-appimage.sh

dist:windows:
  <<: [*rust, *only-tags]
  stage: dist
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 msitools wixl zip > /dev/null
    - rustup target add x86_64-pc-windows-gnu
    - sh packaging/build-windows.sh
  artifacts:
    paths: [app/dist]

# The installers go to the project's package registry (Deploy → Package Registry), one
# package per version.
publish:
  <<: *only-tags
  stage: publish
  image: docker.io/curlimages/curl:latest
  needs: ["dist:rpm-el9", "dist:rpm-el10", "dist:appimage", "dist:windows"]
  script:
    - version="${CI_COMMIT_TAG#v}"
    - |
      for f in app/dist/*; do
        echo "Publishing $(basename "$f")"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/refbraid/$version/$(basename "$f")"
      done
